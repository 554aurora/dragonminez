name: Combat Addon Build

on:
  workflow_dispatch:
  push:
    branches:
      - agent/combat-addon
    paths:
      - 'dmz-combat-addon/**'
      - '.github/workflows/combat-addon-build.yml'
  pull_request:
    paths:
      - 'dmz-combat-addon/**'
      - '.github/workflows/combat-addon-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Build standalone addon
        run: |
          chmod +x ./gradlew
          ./gradlew -p dmz-combat-addon clean build --no-daemon --stacktrace

      - name: Upload installable JAR
        uses: actions/upload-artifact@v4
        with:
          name: dmzcombataddon-1.0.0
          path: dmz-combat-addon/build/libs/dmzcombataddon-1.0.0.jar
          if-no-files-found: error
