name: Combat Rework Build Artifact

on:
  workflow_dispatch: {}
  push:
    branches:
      - agent/combat-addon
    paths:
      - 'dmz-combat-addon/**'
      - '.github/workflows/combat-rework-build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17 Temurin
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle

      - name: Build standalone addon
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew -p dmz-combat-addon clean build --no-daemon --stacktrace

      - name: Verify installable JAR
        shell: bash
        run: |
          test -f dmz-combat-addon/build/libs/dmzcombataddon-1.0.0.jar
          sha256sum dmz-combat-addon/build/libs/dmzcombataddon-1.0.0.jar

      - name: Upload installable addon JAR
        uses: actions/upload-artifact@v4
        with:
          name: dmzcombataddon-1.0.0
          path: dmz-combat-addon/build/libs/dmzcombataddon-1.0.0.jar
          if-no-files-found: error
          retention-days: 7
