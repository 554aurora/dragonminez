name: Combat Rework Build Artifact

on:
  push:
    branches:
      - main
      - agent/combat-rework
  pull_request:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 17 Temurin
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Enable dependency downloads on the clean runner
        shell: bash
        run: sed -i 's/^org.gradle.offline=true$/org.gradle.offline=false/' gradle.properties

      - name: Build distributable jar
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew build --build-cache

      - name: Resolve distributable jar
        id: artifact
        shell: bash
        run: |
          set -euo pipefail
          version="$(grep '^mod_version=' gradle.properties | cut -d= -f2-)"
          jar="build/libs/dragonminez-${version}.jar"
          test -f "$jar"
          echo "jar=$jar" >> "$GITHUB_OUTPUT"
          sha256sum "$jar"

      - name: Upload installable jar
        uses: actions/upload-artifact@v4
        with:
          name: dragonminez-combat-rework
          path: ${{ steps.artifact.outputs.jar }}
          if-no-files-found: error
          retention-days: 7
