plugins {
    id 'java'
    id 'idea'
    id 'net.minecraftforge.gradle' version '6.0.30'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
    id 'org.spongepowered.mixin' version '0.7.38'
}

group = mod_group
version = mod_version

base {
    archivesName = mod_id
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(17)
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

repositories {
    maven { url = 'https://cursemaven.com'; content { includeGroup 'curse.maven' } }
    maven { url = 'https://maven.minecraftforge.net/' }
    maven { url = 'https://maven.parchmentmc.org' }
    mavenCentral()
}

minecraft {
    mappings channel: mapping_channel, version: mapping_version
}

mixin {
    add sourceSets.main, 'dmzcombataddon.refmap.json'
    config 'dmzcombataddon.mixins.json'
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"
    annotationProcessor 'org.spongepowered:mixin:0.8.7:processor'

    // Official DragonMineZ 2.1.3 (CurseForge project 1136088, file 8469416).
    implementation fg.deobf('curse.maven:dragonminez-1136088:8469416')
}

tasks.named('processResources', ProcessResources).configure {
    def replaceProperties = [
            mod_id: mod_id,
            mod_name: mod_name,
            mod_version: mod_version
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    archiveClassifier = ''
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : '554aurora',
                'Specification-Version'   : mod_version,
                'Implementation-Title'    : mod_name,
                'Implementation-Version'  : mod_version,
                'Implementation-Vendor'   : '554aurora',
                'MixinConfigs'             : 'dmzcombataddon.mixins.json'
        ])
    }
    finalizedBy 'reobfJar'
}

reobf {
    jar {}
}

tasks.named('build').configure {
    dependsOn 'reobfJar'
}
